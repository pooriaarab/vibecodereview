name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lint-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # bunx runs downloaded package code; keep the token out of .git/config.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: oxlint (agent budgets — warn-only, ratchet to error later)
        run: bunx oxlint@^1 --config .oxlintrc.json
      # A failed step otherwise skips the rest, so a duplication finding
      # would hide behind the lint error for a whole cycle.
      - name: jscpd
        if: ${{ !cancelled() }}
        run: bunx jscpd@5.1.1 --no-tips .
      # The selfchecks used to run only at publish time, so a broken parser
      # reached every consumer before anything went red. Run them per PR.
      #
      # `npm test`, not `npm run selfcheck`: the test script chains into the
      # selfchecks, so calling the part instead of the aggregate meant every
      # test file added beside them ran on a developer's machine and never on a
      # pull request. A test CI does not execute is not verification.
      - name: test
        if: ${{ !cancelled() }}
        run: npm test
