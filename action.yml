name: "vibecodereview"
description: "LLM-council PR review: many models, diverse lenses, one self-healing GitHub check."
branding:
  icon: "eye"
  color: "purple"

inputs:
  claude_code_oauth_token:
    description: "Claude Code OAuth token (from `claude setup-token`). The chair model — synthesizes, fixes, posts the review."
    required: true
  claude_code_oauth_token_2:
    description: "Backup Claude Code OAuth token (a second subscription). Used only if the chair run with the primary token fails (e.g. rate-limit / quota exhaustion). Omit to disable failover."
    required: false
  claude_code_oauth_token_3:
    description: "Third Claude Code OAuth token. Used only if BOTH the primary and backup chair runs fail. A two-deep chain leaves the whole fleet on one subscription once the primary caps out, which is how a fleet-wide outage happens. Omit to keep the chain two deep."
    required: false
  claude_code_oauth_token_4:
    description: "Fourth Claude Code OAuth token. Used only after the first three chair runs fail. Omit to keep the chain three deep."
    required: false
  github_token:
    description: "Token for gh (PR read + review write). Pass the workflow github.token from the caller."
    required: true
  openai_api_key:
    description: "OpenAI key — GPT/Codex council member (correctness lens). Omit to drop it."
    required: false
  gemini_api_key:
    description: "Gemini key — performance lens. Omit to drop it."
    required: false
  moonshot_api_key:
    description: "Moonshot/Kimi key — security lens. Omit to drop it."
    required: false
  openrouter_api_key:
    description: "OpenRouter key — Grok/DeepSeek member (maintainability lens). Omit to drop it."
    required: false
  chair_fallback_model:
    description: "Model for the OpenRouter fallback chair, used only when every Claude OAuth token fails. Defaults to anthropic/claude-sonnet-5 — the same model the primary chair runs — so the fallback review reads like the real one. Set empty-string behaviour by omitting; omit openrouter_api_key to disable the fallback entirely."
    required: false
    default: "anthropic/claude-sonnet-5"
  council_models:
    description: "Optional CSV override: provider|model|Name|lens,... (providers: openai, gemini, moonshot, openrouter, custom, claude, claude2). `claude`/`claude2` are subscription-backed seats that shell the Claude Code CLI using claude_code_oauth_token / _2 instead of a metered API key."
    required: false
  can_push_fixes:
    description: "If true, the chair may commit and push fixes to the PR branch."
    required: false
    default: "true"
  file_unfixed_findings:
    description: "If true, a council finding the pull request did not fix is filed as a GitHub issue carrying the triage label. Filed, not scheduled: triage decides whether it is worth doing. Off by default, because a queue of agent-written issues nobody agreed to is worse than none."
    required: false
    default: "false"
  require_proof:
    description: "If true, the chair checks that the PR body's evidence matches the diff — a UI change needs before/after screenshots, a command needs its result. Set false in a repo where no change is ever visible. See pr-standards.md in pooriaarab/scripts."
    required: false
    default: "true"
  max_fix_cycles:
    description: "Stop auto-pushing fixes after this many of our own consecutive commits (loop guard). Each fix commit is a new `synchronize` event, so it re-runs every other pull_request workflow in the repo — budget this against how many you have. See 'What a fix cycle costs' in the README."
    required: false
    default: "3"
  checkout_depth:
    description: "Commits to fetch. The chair reads the full diff from the API; council members also need the previous reviewed head when it is in this checkout. Must exceed max_fix_cycles + 3. Set to 0 for a full clone."
    required: false
    default: "50"
  max_council_runs:
    description: "Stop after this many reviews from claude[bot] on one pull request. A PR on its third review is not converging, and a fourth costs the same as the first. Set 0 to disable."
    required: false
    default: "3"
  council_timeout_ms:
    description: "Per-member deadline for the council fan-out. Members run in parallel, so this is the council's worst-case wall time. Omit for the 90s default."
    required: false
    default: ""
  mutation_lens:
    description: "Set to `true` to add a sixth member that asks whether the tests in the diff can fail at all: for each test added or changed it names one concrete mutation to the code under it that the test must catch. Off by default. It is dropped automatically on a diff that adds no test lines, and the report says so. It proposes mutations and does not run them — treat a finding as a claim to check, not a measured result."
    required: false
    default: "false"
  mutation_model:
    description: "Model for the mutation member, over OpenRouter. Its own env var keeps it from silently repointing the scope or maintainability lens, which ride the same OpenRouter route. It still shares openrouter_api_key with those lenses, so a quota failure on that key still takes out all three."
    required: false
    default: ""
  lens_path_filter:
    description: "Optional JSON object mapping each lens to a regex or array of regexes for paths it should skip. Empty by default: no path-based lens skipping. Keep filters per-lens; security has no built-in executable-file allowlist."
    required: false
    default: ""
  vibetrace_ingest_url:
    description: "Optional POST endpoint for vibetrace review.council records. When unset, the emit step writes JSONL under RUNNER_TEMP and never fails the review."
    required: false
    default: ""
  vibetrace_ingest_token:
    description: "Optional Bearer token for authorization at the vibetrace_ingest_url. When unset, POST requests are sent without an Authorization header."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # A full-history clone is usually waste here: the diff comes from the API,
    # and the delta needs only the previous reviewed head plus the commits the
    # fix-cycle guard counts. A missing previous head fails open to the API diff.
    # Recorded before anything reviews, so the result gate can tell a review
    # posted by THIS run from one left by an earlier cycle. Without it a stale
    # review from yesterday would satisfy today's gate.
    - name: Mark the start of this run
      id: gate_start
      shell: bash
      run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.checkout_depth }}
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Configure git
      shell: bash
      run: |
        git config user.name "vibecodereview[bot]"
        git config user.email "vibecodereview@users.noreply.github.com"

        # Strip a model trailer from every commit this run makes.
        #
        # The Claude Code CLI adds `Co-Authored-By: Claude <model> ...` by
        # default, and the fleet's PR standard rejects a commit trailer naming a
        # model or an agent. So the chair pushed a fix and turned the pull
        # request red on a commit its author cannot amend, because they did not
        # make it. pooriaarab/skills#262 sat red for exactly this.
        #
        # A hook rather than a line in the prompt: a prompt is a request to a
        # model, and this has to hold every time. The commit already says
        # vibecodereview[bot] in its author field, so the trailer carried no
        # attribution a reader did not already have.
        #
        # core.hooksPath is a directory under .git, never the working tree.
        # Two reasons: `.git` is never tracked, so the hook file can never
        # collide with (and overwrite) a file the consumer repo already
        # tracks at that path; and the chair's later `git add -A` can never
        # see it, so no exclude entry is needed to keep it out of a commit.
        # `git rev-parse --git-path hooks` was rejected instead of this: it
        # resolves through a GLOBAL hooksPath wherever one is configured, and
        # this must never write outside the checkout. `git rev-parse
        # --git-dir` is not affected by hooksPath, so it has neither problem.
        VCR_HOOKS_DIR="$(git rev-parse --git-dir)/vcr-hooks"
        mkdir -p "$VCR_HOOKS_DIR"
        cat > "$VCR_HOOKS_DIR/prepare-commit-msg" <<'VCR_HOOK_EOF'
        #!/usr/bin/env python3
        # Drop any Co-authored-by line naming a model or an agent vendor.
        # vibecodereview is spared on purpose: the standard exempts it by name.
        #
        # Keep this in sync with bannedCommitTrailers in the fleet's
        # pr-standards config (pooriaarab/scripts, pr-standards.md) -- that
        # list is the authority and can grow per repo without editing the
        # checker there, which this static list cannot follow automatically.
        import re, sys

        BANNED = r"claude|codex|gemini|kimi|muse|pi|chatgpt|gpt|copilot|cursor|devin|anthropic|openai"
        path = sys.argv[1]
        kept = []
        for line in open(path).read().splitlines(keepends=True):
            match = re.match(r"\s*co-authored-by:\s*(.*)", line, re.I)
            named = match and re.search(rf"\b({BANNED})\b", match.group(1), re.I)
            spared = match and re.search("vibecodereview", match.group(1), re.I)
            if named and not spared:
                continue
            kept.append(line)
        open(path, "w").write("".join(kept))
        VCR_HOOK_EOF
        chmod +x "$VCR_HOOKS_DIR/prepare-commit-msg"
        git config core.hooksPath "$VCR_HOOKS_DIR"

    - name: Write PR context
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # Single GraphQL query replaces the two sequential calls (gh pr view +
        # gh api graphql). One round trip instead of two. The query returns
        # title, body and closing issues together; jq formats them into the
        # same shape the two-step produced.
        PR_NUM="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        OWNER="${REPO%/*}"
        NAME="${REPO#*/}"
        gh api graphql -F owner="$OWNER" -F repo="$NAME" -F pr="$PR_NUM" -f query='
          query($owner: String!, $repo: String!, $pr: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $pr) {
                title
                body
                closingIssuesReferences(first: 10) {
                  nodes { title body }
                }
              }
            }
          }
        ' --jq '"TITLE: \(.data.repository.pullRequest.title)\n\nBODY:\n\(.data.repository.pullRequest.body // "")\n" + ([
          .data.repository.pullRequest.closingIssuesReferences.nodes // []
          | .[] | select(. != null)
          | "\n--- LINKED ISSUE: \(.title) ---\n\(.body // "")"
        ] | join(""))' > "$RUNNER_TEMP/pr-context.txt" || true

        # Same semantics as before: a failure to fetch context is a no-op,
        # never an error, and the council still runs.

    # The council runs once per review. Counting claude[bot] reviews on the
    # pull request replaces the old workflow-run count, which needed the
    # actions: read permission that 79 of 81 consumer workflows did not grant.
    # pull-requests: read is always available.
    - name: Budget guard
      id: budget
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        VCR_REPO: ${{ github.repository }}
        VCR_PR: ${{ github.event.pull_request.number }}
        VCR_ACTION_PATH: ${{ github.action_path }}
        VCR_MAX_COUNCIL: ${{ inputs.max_council_runs }}
      run: |
        set -euo pipefail
        # A failed lookup must never stop a review. Degrade to 0, so an API
        # blip reads as "no spend yet" rather than "out of budget".
        max_council="${VCR_MAX_COUNCIL:-0}"
        # Unlike the API blip above, a misconfigured ceiling must not fail
        # open: "$max_council" -gt 0 on a non-numeric value fails without
        # tripping `set -e` (it is the condition of an if), which would
        # otherwise disable the ceiling silently instead of erroring.
        case "$max_council" in
          ''|*[!0-9]*)
            echo "::error::max_council_runs must be a nonnegative integer, got '$max_council'"
            exit 1
            ;;
        esac
        REVIEWS=$(bash "$VCR_ACTION_PATH/scripts/budget-guard.sh" "$VCR_REPO" "$VCR_PR")
        council="$REVIEWS"
        over=""
        if [ "$max_council" -gt 0 ] && [ "$council" -ge "$max_council" ]; then
          over="this review has already run $council times on the pull request, and the ceiling is $max_council"
        fi
        {
          echo "over=$( [ -n "$over" ] && echo true || echo false )"
          echo "council_runs=$council"
          echo "reason=$over"
        } >> "$GITHUB_OUTPUT"
        echo "council runs: $council/$max_council"
        if [ -n "$over" ]; then echo "Over budget: $over"; fi

    # The council is network-bound and the setup below is not, so start the
    # fan-out here and collect it just before the chair. Everything between the
    # two steps — the CLI install, the fix-cycle guard, the prompt build — now
    # runs inside the council's own latency instead of after it.
    - name: Council fan-out (start)
      if: steps.budget.outputs.over != 'true'
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        MOONSHOT_API_KEY: ${{ inputs.moonshot_api_key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        # Subscription-backed council seats (provider `claude` / `claude2`).
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        CLAUDE_CODE_OAUTH_TOKEN_2: ${{ inputs.claude_code_oauth_token_2 }}
        COUNCIL_MODELS: ${{ inputs.council_models }}
        COUNCIL_TIMEOUT_MS: ${{ inputs.council_timeout_ms }}
        MUTATION_LENS: ${{ inputs.mutation_lens }}
        MUTATION_MODEL: ${{ inputs.mutation_model }}
        LENS_PATH_FILTER: ${{ inputs.lens_path_filter }}
        PR_CONTEXT_FILE: ${{ runner.temp }}/pr-context.txt
        REQUIRE_PROOF: ${{ inputs.require_proof }}
      run: |
        # The council's scratch files live in the workspace, because the chair
        # prompt tells it to `cat pr.diff` and read `council-findings.md`. But
        # the chair's fix step runs `git add -A`, which sweeps them into the
        # commit -- pooriaarab/skills#209 shipped council.log, council.pid,
        # pr.diff and probe.1-3 into a public repo that way. Exclude them
        # locally so `git add -A` cannot see them. .git/info/exclude is not
        # committed, so this never touches the consumer repo's .gitignore.
        # Patterns are anchored to the workspace root (leading `/`) so a
        # legitimately named file elsewhere in the tree, e.g. tests/probe.js
        # or docs/pr.diff, is not silently excluded from the chair's commit.
        # Listed exactly (no `probe.*` glob) so a legitimately named
        # `probe.<ext>` file elsewhere at the root is never swallowed.
        # The commit-trailer hook from "Configure git" needs no entry here:
        # it lives under .git/vcr-hooks, outside the working tree `git add -A`
        # walks.
        printf '%s\n' /pr.diff /pr-delta.diff /council-findings.md /council-carry.md /council-carry.next.md /review-state.md /council.log /council.pid \
          /probe.1 /probe.2 /probe.3 /reason.1 /reason.2 /reason.3 \
          >> "$(git rev-parse --git-dir)/info/exclude"

        # Keep the chair's evidence complete, but make council member calls
        # incremental. The state comment is updated only after a successful
        # chair, so a failed run never advances the review boundary.
        REVIEW_HEAD_SHA="$(git rev-parse HEAD)"
        STATE_LOOKUP_FAILED=false
        STATE_INVALID=false
        if ! STATE_BODY="$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" 2>/dev/null \
          | jq -s -r '[.[][] | select((.user.login == "vibecodereview[bot]" or .user.login == "github-actions[bot]") and ((.body // "") | startswith("<!-- vibecodereview:review-state -->")))] | last | .body // empty')"; then
          STATE_LOOKUP_FAILED=true
          STATE_BODY=""
        fi
        LAST_REVIEWED_SHA="$(printf '%s\n' "$STATE_BODY" | sed -n 's/^sha://p' | head -n 1)"
        PRIOR_B64="$(printf '%s\n' "$STATE_BODY" | sed -n 's/^carry://p' | head -n 1)"
        printf '%s' "$PRIOR_B64" > "$RUNNER_TEMP/vcr-prior-carry.b64"
        : > council-carry.md
        if [ -n "$PRIOR_B64" ] && ! printf '%s' "$PRIOR_B64" | base64 --decode > council-carry.md 2>/dev/null; then
          LAST_REVIEWED_SHA=""
          PRIOR_B64=""
          STATE_INVALID=true
          : > council-carry.md
          MEMBER_DIFF_NOTE="full pull-request diff (previous review state was corrupt)"
        fi
        gh pr diff ${{ github.event.pull_request.number }} > pr.diff || true
        if [ "$STATE_LOOKUP_FAILED" = true ]; then
          MEMBER_DIFF_NOTE="full pull-request diff (previous review state could not be read)"
        elif [ "$STATE_INVALID" = true ]; then
          MEMBER_DIFF_NOTE="full pull-request diff (previous review state was corrupt)"
        else
          MEMBER_DIFF_NOTE="full pull-request diff (no prior reviewed SHA)"
        fi
        if printf '%s' "$LAST_REVIEWED_SHA" | grep -Eq '^[0-9a-f]{40,64}$' \
          && git cat-file -e "$LAST_REVIEWED_SHA^{commit}" 2>/dev/null; then
          if git merge-base --is-ancestor "$LAST_REVIEWED_SHA" "$REVIEW_HEAD_SHA"; then
            # -c core.quotePath=false: default quoting octal-escapes any
            # non-ASCII byte in a path (e.g. "café.js" becomes "caf\303\251.js"
            # wrapped in quotes), which review-delta.mjs's `diff --git a/... b/...`
            # parser does not unescape. Left on, every lens but scope silently
            # skips a file whose path holds one of those bytes.
            if git -c core.quotePath=false diff "$LAST_REVIEWED_SHA..$REVIEW_HEAD_SHA" > pr-delta.diff; then
              MEMBER_DIFF_NOTE="delta since reviewed head \`$LAST_REVIEWED_SHA\`"
            else
              cp pr.diff pr-delta.diff
              MEMBER_DIFF_NOTE="full pull-request diff (checkout_depth could not produce the delta)"
            fi
          else
            cp pr.diff pr-delta.diff
            MEMBER_DIFF_NOTE="full pull-request diff (prior reviewed head \`$LAST_REVIEWED_SHA\` is not an ancestor; branch was force-pushed)"
          fi
        elif printf '%s' "$LAST_REVIEWED_SHA" | grep -Eq '^[0-9a-f]{40,64}$'; then
          cp pr.diff pr-delta.diff
          if gh api "repos/${{ github.repository }}/commits/$LAST_REVIEWED_SHA" >/dev/null 2>&1; then
            MEMBER_DIFF_NOTE="full pull-request diff (prior reviewed head \`$LAST_REVIEWED_SHA\` was not fetched; checkout_depth is too shallow)"
          else
            MEMBER_DIFF_NOTE="full pull-request diff (prior reviewed head \`$LAST_REVIEWED_SHA\` is unreachable; branch was force-pushed)"
          fi
        else
          cp pr.diff pr-delta.diff
        fi
        printf '%s\n' "$REVIEW_HEAD_SHA" > "$RUNNER_TEMP/vcr-review-head-sha"
        printf 'VCR_REVIEW_HEAD_SHA=%s\n' "$REVIEW_HEAD_SHA" >> "$GITHUB_ENV"
        printf 'VCR_MEMBER_DIFF_NOTE=%s\n' "$MEMBER_DIFF_NOTE" >> "$GITHUB_ENV"
        export COUNCIL_MEMBER_DIFF_FILE="$PWD/pr-delta.diff"
        export VCR_REVIEW_HEAD_SHA="$REVIEW_HEAD_SHA"
        export VCR_MEMBER_DIFF_NOTE="$MEMBER_DIFF_NOTE"
        export VCR_PRIOR_FINDINGS_FILE="$PWD/council-carry.md"
        export VCR_CARRY_FILE="$PWD/council-carry.next.md"
        printf '%s\n' /council-carry.next.md >> "$(git rev-parse --git-dir)/info/exclude"
        nohup node "${{ github.action_path }}/scripts/council-review.mjs" \
          pr.diff council-findings.md > council.log 2>&1 &
        echo $! > council.pid
        echo "council started (pid $(cat council.pid))"

    - name: Install Claude Code CLI
      # anthropics/claude-code-action expects the Claude Code native binary at
      # ~/.local/bin/claude; install it here so the chair step never dies with
      # "native binary not found". GITHUB_PATH persists into later steps.
      # Skip the download when a caller workflow already installed it — several
      # do, and paying for the same install twice cost ~5s a run.
      shell: bash
      run: |
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        if command -v claude >/dev/null 2>&1 || [ -x "$HOME/.local/bin/claude" ]; then
          echo "Claude Code CLI already present; skipping install."
        else
          # Retry the download. Every later step -- the council fan-out, all
          # three chair attempts, the OpenRouter fallback -- runs after this
          # one, so a single connection reset here loses the whole review and
          # none of those fallbacks gets a turn. --retry-all-errors is the
          # flag that makes a reset retryable: on its own --retry covers
          # transient HTTP statuses and timeouts, and a reset is neither.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
          bash "$RUNNER_TEMP/install-claude.sh"
        fi

    - name: Fix-cycle guard
      id: cycle
      shell: bash
      run: |
        # Count our own consecutive commits at HEAD. After the limit, stop
        # pushing fixes (comment-only) so review->fix->re-review can't loop
        # forever.
        LIMIT="${{ inputs.max_fix_cycles }}"
        COUNT=0
        # Only our own commits count against the budget. Matching any *[bot]
        # author let an unrelated bot (dependabot, another action's self-heal)
        # sitting at HEAD burn the fix budget and silently turn fixes off.
        while IFS= read -r AUTHOR; do
          [ "$AUTHOR" = "vibecodereview[bot]" ] || break
          COUNT=$((COUNT + 1))
        done < <(git log --format='%an' -"$((LIMIT + 3))")
        if [ "$COUNT" -ge "$LIMIT" ] || [ "${{ inputs.can_push_fixes }}" = "false" ]; then
          echo "can_push=false" >> "$GITHUB_OUTPUT"
        else
          echo "can_push=true" >> "$GITHUB_OUTPUT"
        fi
        echo "cycles=$COUNT" >> "$GITHUB_OUTPUT"
        echo "Consecutive bot commits at HEAD: $COUNT (limit $LIMIT)"

    # ONE chair prompt, built once into the environment and reused by every
    # failover attempt below. It used to be pasted inline per attempt with a
    # "keep these in sync" comment; a third attempt would have made that three
    # copies of a 40-line prompt that must never drift.
    - name: Build chair prompt
      id: prompt
      shell: bash
      env:
        VCR_PR: ${{ github.event.pull_request.number }}
        VCR_REPO: ${{ github.repository }}
        VCR_BRANCH: ${{ github.event.pull_request.head.ref }}
        VCR_CANPUSH: ${{ steps.cycle.outputs.can_push }}
        VCR_CYCLES: ${{ steps.cycle.outputs.cycles }}
        VCR_REQUIRE_PROOF: ${{ inputs.require_proof }}
      run: |
        cat > "$RUNNER_TEMP/chair-prompt.txt" <<'VCR_PROMPT_EOF'
        You chair an LLM council reviewing PR #__PR__ in __REPO__.
        Branch: __BRANCH__. Can push fixes: __CANPUSH__ (automated fix cycles so far: __CYCLES__).
        The council report records the exact reviewed head SHA. Include its `Reviewed head:` line in your review summary.

        LOOP GUARD: if "Can push fixes" is false, DO NOT push any commits — leave a review comment only. If a prior cycle already tried to fix an issue and it persists, stop fixing it and flag it for a human instead of pushing again.

        Council members each reviewed this PR through one lens (correctness, performance,
        security, maintainability) and wrote findings to `council-findings.md`. You are the
        synthesizer and the ONLY member who can push fixes.

        1. Read the diff. It is ALREADY on disk at `pr.diff` — `cat pr.diff`. Do not spend a
           turn re-fetching it. Only if that file is missing or empty, fall back to
           `gh pr diff __PR__`.
        2. Read `council-findings.md`. Each item is an UNVERIFIED claim, not ground truth.
           For every claim, open the file and read the surrounding code (not just the hunk)
           and confirm it against the real code. De-dupe (same issue from many lenses = one).
           Findings under `Findings carried forward` came from earlier cycles: re-check them
           and retain every unresolved one even when the current delta does not contain its lines.
           DISCARD a claim (and note why) if: a linter/type-checker already covers it; the
           failing path is unreachable; it is style/taste/naming; it is pre-existing code this
           diff did not touch; it names no concrete failure trigger; or two lenses contradict
           and neither proves it. A member listed as an error/skip produced no claims — do not
           go looking for its findings.
        3. Repo conventions: CLAUDE.md is already loaded into your context, so do not re-read
           it. Read AGENTS.md and the `.claude/rules/` files that match the paths this diff
           touches — those only. Do not enumerate the whole rules directory.
           Read VISION.md when the repo has one: it states what this repo is for, and it is
           the only thing that can tell you a change is well-built and still does not belong
           here.
        4. Add your own lenses. Assume the author is competent; flag only diff-introduced
           defects with a concrete failure trigger.
           - conventions and test coverage.
           __PROOFLENS__
        5. If "Can push fixes" is true and you find clear, confirmed bugs/security/convention
           issues, fix them (Edit/Write), then:
           `git add -A && git commit -m "fix: <what>" && git push origin __BRANCH__`
           Do NOT push style-only or speculative changes.
           NEVER add a `Co-Authored-By:` trailer, or any trailer naming a model or an agent.
           The fleet PR standard rejects model attribution in commit messages, so a repo that
           enforces `pr-standards` fails its own review bot and the PR cannot merge until a
           human squashes your commit away. Attribution belongs in the PR body as
           `Assisted-by:`, which the author writes, not you.
        5b. PR-STANDARD LENS. If the repo has `.github/pr-standards.json`, this PR is subject
           to the fleet standard: a `<prefix>-<issue>-<slug>` branch, a `[PREFIX-<issue>]
           <imperative subject>` title, a body with exactly one `Closes #<issue>` plus
           `## What`, `## Why`, and a `## How I verified` that names a real command and its
           result, ending in `Assisted-by:`. Hard caps: 500 counted lines and 40 counted
           files (lockfiles, build output, snapshots, generated code and migrations do not
           count). Report violations as Major findings.
           Over a cap is NOT something you fix. Do not delete work to fit, and do not push a
           fix that would carry the PR over: your own commits count. Say it is over, name the
           concrete split — which files or which concern belongs in a follow-up PR, and in
           what order they should land — and leave the work in place for the author.
        6. Assign severity yourself (council members do not rate it): Critical (security, crash,
           data loss), Major (real bug / convention violation), Minor (rest). Post Major+ inline,
           roll Minor into the summary, cap ~8 inline comments. Submit ONE review with
           `gh pr review` (--approve / --request-changes / --comment).
           Your verdict describes what is STILL WRONG AFTER your own fixes, not what you
           found before them. So:
             - A Critical is still open (you could not fix it, or chose not to):
               --request-changes, naming specifically what remains open.
             - You found and/or fixed something (any severity) and no Critical is
               left open: --comment. For each finding say plainly whether you
               fixed it or it remains open — never report an unfixed finding
               as fixed.
             - You found nothing and pushed nothing: --approve.
           Never --approve in a run where you pushed fixes (use --comment).
           Do NOT --request-changes for a defect you repaired in this run. That blocks the
           PR on a finding that no longer exists, and nothing you are allowed to do next
           can clear it: your fix push is authenticated with GITHUB_TOKEN, and GitHub does
           not trigger workflows for GITHUB_TOKEN pushes, so no later run posts the
           approval that would supersede the block. Only a human dismissing the review
           can. See issue #43.
        7. In the review body include a collapsible council table:
           `<details><summary>🧑‍⚖️ Council</summary>` then a Markdown table of
           `| Model | Lens | Result |` (confirmed / rejected / no findings), then `</details>`.
           If council was skipped, write "Council: skipped".
        VCR_PROMPT_EOF
        # The heredoc is quoted so the prompt stays literal (it contains
        # backticks and $ that must not be expanded). Fill the run's values in
        # with bash parameter expansion, reading them from the environment —
        # never by interpolating a GitHub context straight into a sed pattern,
        # which a branch name can break or inject through.
        if [ -z "$VCR_PR" ] || [ -z "$VCR_BRANCH" ]; then
          echo "::error::chair prompt inputs missing (pr='$VCR_PR' branch='$VCR_BRANCH')"
          exit 1
        fi
        PROMPT="$(cat "$RUNNER_TEMP/chair-prompt.txt")"
        PROMPT="${PROMPT//__PR__/$VCR_PR}"
        PROMPT="${PROMPT//__REPO__/$VCR_REPO}"
        PROMPT="${PROMPT//__BRANCH__/$VCR_BRANCH}"
        PROMPT="${PROMPT//__CANPUSH__/$VCR_CANPUSH}"
        PROMPT="${PROMPT//__CYCLES__/$VCR_CYCLES}"
        # Mirror council-config.mjs: when proof is off, drop the whole bullet
        # rather than interpolate the flag into a still-mandatory instruction
        # the chair could follow regardless of what the flag says.
        if [ "${VCR_REQUIRE_PROOF:-true}" = "false" ]; then
          PROOF_LENS="- proof: disabled for this repo (require_proof: false). Do not ask for screenshots or command results."
        else
          PROOF_LENS="- proof (required in this repo: true). The body's \`## How I verified\`
             must carry evidence that matches the diff. Flag it when a UI change shows no
             before/after screenshot, when an embedded screenshot shows a screen this diff does
             not touch, when a named command has no result, when the evidence
             leaves untested a code path this PR changes, when the evidence predates the
             newest commit that touched a path it exercises, or when a
             \`Proof: n/a\` reason does not hold. Name the capture that would settle it. Never push a proof fix: evidence is
             the author's to produce, and a chair that invents it defeats the check."
        fi
        PROMPT="${PROMPT//__PROOFLENS__/$PROOF_LENS}"
        # An empty prompt is the one failure this step can produce, and it fails
        # SILENTLY downstream: claude-code-action skips and reports success, so
        # the PR gets a green review check with no review behind it. Fail here
        # instead, where the cause is obvious.
        if [ ${#PROMPT} -lt 200 ] || case "$PROMPT" in *__PR__*|*__BRANCH__*) true;; *) false;; esac; then
          echo "::error::chair prompt did not build (length ${#PROMPT}, placeholders may remain)"
          exit 1
        fi
        # Publish as a STEP OUTPUT, not an env var. The `env` context is not
        # available in a composite step's `with:` block, so passing the prompt
        # through $GITHUB_ENV silently delivers an EMPTY prompt — and
        # claude-code-action treats no prompt as "nothing to do", skips, and
        # reports SUCCESS. That is a green check for a review that never ran.
        # The `steps` context does reach `with:`.
        {
          echo "text<<VCR_OUT_EOF"
          printf '%s\n' "$PROMPT"
          echo "VCR_OUT_EOF"
        } >> "$GITHUB_OUTPUT"

    # Probe the chair tokens before paying for an attempt.
    #
    # A chair attempt costs ~12s of claude-code-action setup (Bun, dependencies,
    # app-token mint and revoke) before the model is reached, and a dead token
    # then fails in ~0.3s. Measured on 7 successful runs across 5 repos
    # (2026-08-28): primary 12.6s median, backup 9.4s median, both dead, on a
    # 52s median job. That is 22s -- 42% of the job -- spent on two attempts
    # that could not succeed.
    #
    # The probe runs the SAME CLI the action runs, with the same token, so it is
    # faithful by construction: a dead token returns the documented signature
    # (is_error true, num_turns 1, total_cost_usd 0, empty modelUsage). The four
    # probes run concurrently, so the cost is one probe (~1-4s), not four.
    #
    # It FAILS OPEN. Only that exact signature prunes an attempt. A timeout, a
    # crash, a parse failure or any unexpected output leaves the attempt in
    # place, because wrongly skipping a healthy chair would silently downgrade
    # every review on the fleet -- a far worse outcome than a wasted 12s. A
    # chair that genuinely ran and failed does not match either: it carries
    # num_turns > 1 and a nonzero cost, so a real bad run is never pruned.
    #
    # Placement is deliberate. This sits between the council's start and its
    # await, so the probe overlaps the council's background window (5.5s
    # measured) instead of adding to the critical path.
    - name: Probe chair tokens
      id: chair_probe
      shell: bash
      env:
        VCR_T1: ${{ inputs.claude_code_oauth_token }}
        VCR_T2: ${{ inputs.claude_code_oauth_token_2 }}
        VCR_T3: ${{ inputs.claude_code_oauth_token_3 }}
        VCR_T4: ${{ inputs.claude_code_oauth_token_4 }}
      run: |
        probe() {
          slot="$1"; token="$2"
          # An absent token is already handled by the `if:` on each attempt.
          # Report it live so this step never becomes a second, divergent gate.
          if [ -z "$token" ]; then echo "live" > "probe.$slot"; return; fi
          # A dead token makes the CLI exit non-zero AND print the dead
          # signature, so the exit code cannot gate the parse. Ignore it and
          # judge the JSON alone; anything unparseable falls through to live.
          out="$(CLAUDE_CODE_OAUTH_TOKEN="$token" ANTHROPIC_API_KEY= \
                 timeout 60 claude -p ok \
                   --max-turns 1 \
                   --allowed-tools "" \
                   --output-format json 2>/dev/null || true)"
          if printf '%s' "$out" | jq -e \
               '.is_error == true and .num_turns == 1 and .total_cost_usd == 0
                and (.modelUsage | type == "object" and length == 0)' \
             >/dev/null 2>&1; then
            echo "dead" > "probe.$slot"
            # Say WHY. 401 means the token is revoked or stale and needs
            # re-minting with `claude setup-token`; 429 means the subscription
            # is capped and only time fixes it. Both look identical in the
            # result JSON otherwise, and the difference decides what to do.
            printf '%s' "$out" \
              | jq -r '"  reason: HTTP \(.api_error_status // "?") \(.result // "no detail")"' \
                    2>/dev/null > "reason.$slot" || true
          else
            echo "live" > "probe.$slot"
          fi
        }
        probe 1 "$VCR_T1" &
        probe 2 "$VCR_T2" &
        probe 3 "$VCR_T3" &
        probe 4 "$VCR_T4" &
        wait
        for s in 1 2 3 4; do
          v="$(cat "probe.$s" 2>/dev/null || echo live)"
          [ "$v" = "dead" ] || v="live"
          echo "token_${s}=$v" >> "$GITHUB_OUTPUT"
          echo "chair token $s: $v"
          [ "$v" = "dead" ] && cat "reason.$s" 2>/dev/null
          true
        done

    - name: Council fan-out (await)
      id: council_await
      shell: bash
      continue-on-error: true
      run: |
        PID="$(cat council.pid 2>/dev/null || true)"
        if [ -n "$PID" ]; then
          # Hard ceiling so a wedged member can never hold the job open; the
          # engine's own per-member timeout should always fire first.
          WAITED=0
          while kill -0 "$PID" 2>/dev/null && [ "$WAITED" -lt 300 ]; do
            sleep 2
            WAITED=$((WAITED + 2))
          done
          kill -0 "$PID" 2>/dev/null && kill "$PID" 2>/dev/null && echo "council exceeded 300s; killed"
        fi
        cat council.log || true
        echo "----- council-findings.md -----"; cat council-findings.md || true

    # Observability only. Silent-fail inside the script. Never gates the review.
    - name: Emit vibetrace review.council
      if: always() && steps.budget.outputs.over != 'true'
      continue-on-error: true
      shell: bash
      env:
        VIBETRACE_INGEST_URL: ${{ inputs.vibetrace_ingest_url }}
        VIBETRACE_INGEST_TOKEN: ${{ inputs.vibetrace_ingest_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        VCR_PR: ${{ github.event.pull_request.number }}
        GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        VCR_PR_BODY: ${{ github.event.pull_request.body }}
        VCR_MEMBER_DIFF_NOTE: ${{ env.VCR_MEMBER_DIFF_NOTE }}
      run: |
        MODE=full
        case "${VCR_MEMBER_DIFF_NOTE:-}" in
          delta*) MODE=delta ;;
        esac
        MEMBERS=0
        if [ -f council-findings.md ]; then
          # grep -c exits 1 (but still prints "0") on zero matches. GitHub's
          # bash shell runs with `set -eo pipefail`, and a failing command
          # substitution in an assignment aborts the step right there -- even
          # inside this `if` body -- which would skip the emit below entirely.
          # `|| true` keeps the "0" stdout but neutralizes the exit status.
          MEMBERS=$(grep -cE '^## .+ — .+ lens' council-findings.md 2>/dev/null || true)
          MEMBERS=${MEMBERS:-0}
        fi
        # Anchored to the exact header the engine emits for a cached member
        # (`## Name — lens lens (cached)`); a bare substring search would also
        # match a finding that happens to quote that text from the diff.
        CACHE_HIT=0
        if [ -f council-findings.md ] && grep -qE '^## .+ lens \(cached\)$' council-findings.md 2>/dev/null; then
          CACHE_HIT=1
        fi
        # `job` is a workflow-job context; composite action steps don't receive
        # it, so `job.status` is always empty here. Read the fan-out step's own
        # outcome instead, the same way the chair steps are checked below.
        CANCELLED=0
        if [ "${{ steps.council_await.outcome }}" = "cancelled" ]; then
          CANCELLED=1
        fi
        node "${{ github.action_path }}/scripts/vibetrace-emit.mjs" review.council \
          --mode "$MODE" --cache-hit "$CACHE_HIT" --members "$MEMBERS" --cancelled "$CANCELLED"

    # Failover chain: each attempt runs the SAME prompt (built once above) with
    # a different subscription. Every attempt costs ~10s of setup even when the
    # token is dead, so order them best-credit-first.
    #
    # The --allowed-tools list below was widened after profiling 6 genuine chair
    # completions (offrouter/adscapi, 2026-08-27): every single one hit
    # permission_denials_count > 0 (6-15 denials against 23-49 total turns, i.e.
    # up to a third of the session). A denied tool_use still costs a full model
    # turn (the model proposes it, gets refused, and needs another turn to
    # recover) for zero work done, so it inflates turns/latency/cost with no
    # review-quality benefit — the opposite of a real tradeoff. `TodoWrite` is
    # the standout: it's a pure in-session bookkeeping tool (no filesystem/
    # network/GitHub side effect) that Claude Code's own system prompt actively
    # recommends for a numbered multi-step procedure — exactly the shape of this
    # prompt — yet it was never in the allowlist. `ls`/`head`/`wc` are read-only
    # exploration verbs added for the same reason: they can only let the chair
    # gather more context, never less, so this cannot weaken the review. `find`
    # is deliberately NOT included: `Bash(find:*)` would also match `find .
    # -delete` and `find . -exec <cmd> {} \;`, which are destructive/arbitrary-
    # execution, not read-only exploration — Glob already covers the pathfinding
    # use case. Kept OUT deliberately: WebFetch/WebSearch (no external network
    # reach for a reviewer), Task (no subagent spawning), NotebookEdit/
    # SlashCommand/ExitPlanMode (not applicable here).
    - name: Chair review (primary token)
      id: chair_primary
      if: steps.budget.outputs.over != 'true' && steps.chair_probe.outputs.token_1 != 'dead'
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        use_commit_signing: true
        allowed_bots: "*"
        prompt: ${{ steps.prompt.outputs.text }}
        claude_args: '--allowed-tools "Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(wc:*),Read,Glob,Grep,Edit,Write,TodoWrite"'

    - name: Chair review (backup token)
      id: chair_backup
      if: steps.budget.outputs.over != 'true' && steps.chair_primary.outcome != 'success' && steps.chair_probe.outputs.token_2 != 'dead' && inputs.claude_code_oauth_token_2 != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token_2 }}
        use_commit_signing: true
        allowed_bots: "*"
        prompt: ${{ steps.prompt.outputs.text }}
        claude_args: '--allowed-tools "Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(wc:*),Read,Glob,Grep,Edit,Write,TodoWrite"'

    - name: Chair review (third token)
      id: chair_third
      if: steps.budget.outputs.over != 'true' && steps.chair_primary.outcome != 'success' && steps.chair_backup.outcome != 'success' && steps.chair_probe.outputs.token_3 != 'dead' && inputs.claude_code_oauth_token_3 != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token_3 }}
        use_commit_signing: true
        allowed_bots: "*"
        prompt: ${{ steps.prompt.outputs.text }}
        claude_args: '--allowed-tools "Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(wc:*),Read,Glob,Grep,Edit,Write,TodoWrite"'

    - name: Chair review (fourth token)
      id: chair_fourth
      if: steps.budget.outputs.over != 'true' && steps.chair_primary.outcome != 'success' && steps.chair_backup.outcome != 'success' && steps.chair_third.outcome != 'success' && steps.chair_probe.outputs.token_4 != 'dead' && inputs.claude_code_oauth_token_4 != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token_4 }}
        use_commit_signing: true
        allowed_bots: "*"
        prompt: ${{ steps.prompt.outputs.text }}
        claude_args: '--allowed-tools "Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(wc:*),Read,Glob,Grep,Edit,Write,TodoWrite"'

    # Surface the true result: green if any chair run succeeded; red if they all
    # failed. Without this, continue-on-error would mask a genuine failure as
    # success. A chair that dies in ~0.5s at $0 cost with one turn is a dead
    # token, not a bad review — check the subscription before the prompt.
    # Last resort. Every Claude token has failed, so the choice is between a
    # weaker review and none at all. On 2026-08-27 both subscriptions capped out
    # at once and the whole fleet lost its review for days — a Claude-only chair
    # makes one vendor's quota a single point of failure for every repo.
    - name: Chair fallback (OpenRouter)
      id: chair_fallback
      if: >-
        steps.budget.outputs.over != 'true' &&
        steps.chair_primary.outcome != 'success' &&
        steps.chair_backup.outcome != 'success' &&
        steps.chair_third.outcome != 'success' &&
        steps.chair_fourth.outcome != 'success' &&
        inputs.openrouter_api_key != ''
      continue-on-error: true
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CHAIR_FALLBACK_MODEL: ${{ inputs.chair_fallback_model }}
        # The proof lens must reach every chair. Without these two the fallback
        # reviewed without it, so a subscription outage turned proof off and the
        # check still reported green.
        PR_CONTEXT_FILE: ${{ runner.temp }}/pr-context.txt
        VCR_REQUIRE_PROOF: ${{ inputs.require_proof }}
        VCR_REVIEW_HEAD_SHA: ${{ env.VCR_REVIEW_HEAD_SHA }}
      run: node "${{ github.action_path }}/scripts/chair-fallback.mjs" pr.diff council-findings.md

    # A completed chair review no longer needs the per-member cache comments;
    # remove them after the final review is posted. A failed cleanup is
    # deliberately non-fatal, like every other cache operation.
    - name: Clear council cache
      if: >-
        steps.budget.outputs.over != 'true' &&
        (steps.chair_primary.outcome == 'success' ||
         steps.chair_backup.outcome == 'success' ||
         steps.chair_third.outcome == 'success' ||
         steps.chair_fourth.outcome == 'success' ||
         steps.chair_fallback.outcome == 'success')
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: node --input-type=module -e 'import(process.argv[1]).then(({ clearCouncilResults }) => clearCouncilResults())' "${{ github.action_path }}/scripts/council-cache.mjs"

    # A budget stop is a routing decision, not a verdict on the code, so it
    # leaves a comment and a label rather than a red check. It writes ONE
    # comment and edits it after that: a pull request that stays over budget
    # for five pushes must not collect five identical comments.
    - name: Route the pull request to a person
      if: steps.budget.outputs.over == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        VCR_REPO: ${{ github.repository }}
        VCR_PR: ${{ github.event.pull_request.number }}
        VCR_REASON: ${{ steps.budget.outputs.reason }}
        VCR_COUNCIL_RUNS: ${{ steps.budget.outputs.council_runs }}
      run: |
        set -euo pipefail
        MARKER="<!-- vibecodereview:budget -->"
        gh label create needs-human --repo "$VCR_REPO" --color B60205 \
          --description "Automation stopped; a person has to decide" 2>/dev/null || true
        gh issue edit "$VCR_PR" --repo "$VCR_REPO" --add-label needs-human >/dev/null
        {
          echo "$MARKER"
          echo "### This pull request is over budget"
          echo
          echo "The review stopped without running, because $VCR_REASON."
          echo
          echo "- Council runs on this PR: $VCR_COUNCIL_RUNS"
          echo
          echo "Nothing here says the code is wrong. It says the automation is not"
          echo "converging, and another cycle costs what the last one cost. Decide:"
          echo "split the change, fix the failure the loop keeps missing, or raise"
          echo "\`max_council_runs\` for this repo if the ceiling is simply too low."
        } > budget-comment.md
        EXISTING=$(gh api --paginate "repos/$VCR_REPO/issues/$VCR_PR/comments" | jq -s \
          "[.[][] | select(.body | startswith(\"$MARKER\")) | .id] | first // empty")
        if [ -n "$EXISTING" ]; then
          gh api "repos/$VCR_REPO/issues/comments/$EXISTING" -X PATCH -F body=@budget-comment.md --silent
        else
          gh api "repos/$VCR_REPO/issues/$VCR_PR/comments" -X POST -F body=@budget-comment.md --silent
        fi

    # The gate asks whether a review was POSTED, not whether a step exited 0.
    #
    # A step can succeed and review nothing. claude-code-action refuses to run
    # when the pull request edits its own workflow file -- a correct control, a
    # pull request must not edit the reviewer that judges it -- and a skipped
    # action still exits 0. So the outcome read `success`, this gate printed
    # "backup token succeeded", the check went green, and no review existed.
    # Eight pull requests in the fleet carried that green check on one day.
    #
    # Green is the dangerous direction: a red check gets investigated and a
    # green one gets merged. So the only evidence accepted here is a review on
    # the pull request, newer than this run's start.
    - name: Chair result gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        VCR_PR: ${{ github.event.pull_request.number }}
        VCR_REPO: ${{ github.repository }}
        P: ${{ steps.chair_primary.outcome }}
        B: ${{ steps.chair_backup.outcome }}
        T: ${{ steps.chair_third.outcome }}
        Q: ${{ steps.chair_fourth.outcome }}
        F: ${{ steps.chair_fallback.outcome }}
        OVER_BUDGET: ${{ steps.budget.outputs.over }}
        TOKEN_1: ${{ steps.chair_probe.outputs.token_1 }}
        TOKEN_2: ${{ steps.chair_probe.outputs.token_2 }}
        TOKEN_3: ${{ steps.chair_probe.outputs.token_3 }}
        TOKEN_4: ${{ steps.chair_probe.outputs.token_4 }}
        STARTED_AT: ${{ steps.gate_start.outputs.at }}
      run: |
        set -uo pipefail

        # The primary subscription failing is easy to miss: the gate can
        # still go green off a later token, and the only trace was a probe
        # line nobody reads unless the gate also fails. Warn every run, not
        # only on failure -- including an over-budget run, which returns
        # before any of the logic below runs.
        if [ "$TOKEN_1" = "dead" ] && { [ "$TOKEN_2" = "live" ] || [ "$TOKEN_3" = "live" ] || [ "$TOKEN_4" = "live" ]; }; then
          echo "::warning::primary Claude subscription token is dead (probe: token_1=$TOKEN_1 token_2=$TOKEN_2 token_3=$TOKEN_3 token_4=$TOKEN_4); this run is on a backup token"
        fi

        if [ "$OVER_BUDGET" = "true" ]; then
          echo "chair: skipped, the pull request is over budget"; exit 0
        fi

        # Which step claims to have reviewed. Kept for the message only; the
        # claim is not what decides the outcome.
        claimed="none"
        [ "$P" = "success" ] && claimed="primary"
        [ "$claimed" = none ] && [ "$B" = "success" ] && claimed="backup"
        [ "$claimed" = none ] && [ "$T" = "success" ] && claimed="third"
        [ "$claimed" = none ] && [ "$Q" = "success" ] && claimed="fourth"
        [ "$claimed" = none ] && [ "$F" = "success" ] && claimed="fallback"

        # `--jq` runs once per page under `--paginate`, so on a PR with more
        # than one page of reviews this printed one number per page and
        # `-gt` blew up on the multi-line result. Piping the raw pages into
        # `jq -s` (the pattern already used above for the budget comment
        # lookup) slurps every page into one array before counting.
        #
        # Login is checked too: without it, any human or unrelated bot review
        # (e.g. coderabbitai[bot], which reviews this very PR) posted after
        # STARTED_AT satisfies the gate even when every chair failed to post.
        # "claude[bot]" covers the four Claude Code Action chairs (confirmed
        # by scripts/budget-guard.sh, which already counts reviews under that
        # login for the same fleet). The OpenRouter fallback posts through
        # `gh pr review` with `inputs.github_token`; on the default wiring
        # (`github_token: ${{ github.token }}`) GitHub attributes that to
        # "github-actions[bot]", but a consumer repo may instead pass a
        # `vibecodereview[bot]`-backed app token, the same login
        # council-cache.mjs and the review-state lookup above already treat
        # as an automation actor -- so it is accepted here too.
        posted=$(gh api "repos/$VCR_REPO/pulls/$VCR_PR/reviews" --paginate 2>/dev/null \
          | jq -s "[.[][] | select(.submitted_at >= \"$STARTED_AT\" and (.user.login == \"claude[bot]\" or .user.login == \"github-actions[bot]\" or .user.login == \"vibecodereview[bot]\"))] | length" 2>/dev/null)
        posted="${posted:-0}"

        if [ "$posted" -gt 0 ]; then
          echo "chair: $claimed posted $posted review(s) this run"
          exit 0
        fi

        echo "chair posted no review this run (claimed=$claimed; primary=$P, backup=${B:-skipped}, third=${T:-skipped}, fourth=${Q:-skipped}, fallback=${F:-skipped})"
        echo "probe: token_1=$TOKEN_1 token_2=$TOKEN_2 token_3=$TOKEN_3 token_4=$TOKEN_4"
        echo "A step that exits 0 without posting is the failure this gate exists to catch."
        echo "Most often: the pull request edits .github/workflows/vibecodereview.yml, and"
        echo "claude-code-action refuses to run when the workflow differs from the default branch."
        exit 1

    # Persist the review boundary and the findings that still need a chair's
    # verification. Updating one hidden comment avoids adding visible noise to
    # every self-healing cycle while keeping the state available after checkout.
    - name: Record review state
      if: steps.budget.outputs.over != 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        VCR_REPO: ${{ github.repository }}
        VCR_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # council-cache.mjs owns the visibility check. It fails closed when the
        # repository cannot be identified or GitHub cannot answer.
        rm -f review-state.md
        node --input-type=module <<'VCR_STATE_EOF'
        import fs from "node:fs";
        import { buildReviewState, shouldWriteReviewState } from "${{ github.action_path }}/scripts/review-delta.mjs";
        import { isRepositoryPrivate } from "${{ github.action_path }}/scripts/council-cache.mjs";

        if (!shouldWriteReviewState(await isRepositoryPrivate())) {
          console.log("Review state skipped: repository is public or visibility is unavailable");
          process.exit(0);
        }

        const headSha = fs.readFileSync(`${process.env.RUNNER_TEMP}/vcr-review-head-sha`, "utf8").trim();
        const carryPath = "council-carry.next.md";
        let carry = fs.existsSync(carryPath) ? fs.readFileSync(carryPath, "utf8") : "";
        if (!fs.existsSync(carryPath)) {
          const encoded = fs.existsSync(`${process.env.RUNNER_TEMP}/vcr-prior-carry.b64`)
            ? fs.readFileSync(`${process.env.RUNNER_TEMP}/vcr-prior-carry.b64`, "utf8").trim()
            : "";
          carry = encoded ? Buffer.from(encoded, "base64").toString("utf8") : "";
        }
        const state = buildReviewState(headSha, carry);
        const stateLines = state.split("\n");
        if (stateLines.length !== 4 || !stateLines[2]?.startsWith("carry:") || stateLines[2].slice(6).includes("\n")) {
          throw new Error("review state payload must be one line");
        }
        fs.writeFileSync("review-state.md", state);
        VCR_STATE_EOF
        if [ ! -s review-state.md ]; then exit 0; fi
        EXISTING=$(gh api --paginate "repos/$VCR_REPO/issues/$VCR_PR/comments" | jq -s -r \
          '[.[][] | select((.user.login == "vibecodereview[bot]" or .user.login == "github-actions[bot]") and ((.body // "") | startswith("<!-- vibecodereview:review-state -->")))] | last | .id // empty')
        if [ -n "$EXISTING" ]; then
          gh api "repos/$VCR_REPO/issues/comments/$EXISTING" -X PATCH -F body=@review-state.md --silent
        else
          gh api "repos/$VCR_REPO/issues/$VCR_PR/comments" -X POST -F body=@review-state.md --silent
        fi
    - name: File unfixed findings
      # Runs after the chair, so the findings it reads are the ones that
      # survived to the final diff. Never fails the review: a finding that could
      # not be filed is worse read in the review than not reviewed at all.
      if: ${{ inputs.file_unfixed_findings == 'true' }}
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        [ -f council-findings.md ] || { echo "no findings file"; exit 0; }
        node "${{ github.action_path }}/scripts/file-findings.mjs" \
          --findings council-findings.md \
          --repo "${{ github.repository }}" \
          --pr "${{ github.event.pull_request.number }}" \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
